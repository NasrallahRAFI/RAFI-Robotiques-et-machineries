name: SEO Guard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-sitemap.mjs
      - run: node scripts/check-seo.mjs --base-url=https://rafirobotique.com
