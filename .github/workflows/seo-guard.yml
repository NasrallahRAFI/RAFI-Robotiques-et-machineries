name: SEO Guard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/generate-sitemap.mjs
      - run: node scripts/check-site.mjs
      - name: Validate SEO against the checked-out site
        shell: bash
        run: |
          node server.mjs > /tmp/rafi-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          node scripts/check-seo.mjs --base-url=http://127.0.0.1:4321
